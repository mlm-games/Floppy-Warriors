[package]
name = "floppy-warriors"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "Floppy Warriors - janky ragdoll archery roguelite"
repository = "https://github.com/mlm-games/floppy-warriors"
readme = "README.md"
keywords = ["bevy", "gamedev", "ragdoll", "2d", "repose"]
categories = ["game-development"]
rust-version = "1.96"
default-run = "floppy-warriors"

[lib]
name = "floppy_warriors"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "floppy-warriors"
path = "src/main.rs"

[features]
default = ["dev_native"]
dev = []
dev_native = ["dev"]
# Big-game optional crates (check note below)
# Keep commented until compatible to avoid breakage.
# input_manager = ["dep:leafwing-input-manager"]
# hanabi = ["dep:bevy_hanabi"]
# pkv = ["dep:bevy_pkv"]
# asset_loader = ["dep:bevy_asset_loader"]
# inspector = ["dep:bevy-inspector-egui"]
# kira_audio = ["dep:bevy_kira_audio"]

[dependencies]
# Direct dep: bevy derive macros expand to `bevy_ecs::` paths, so every
# game crate names it explicitly. Must unify with repame-sim's 0.20.
bevy_ecs = "0.20"
# Same glam as repame: shared math types must unify to one version.
glam = "0.33"
repame-sim = "0.3.34"
repame-shell = "0.3.34"
repame-view2d = "0.3.34"
repame-atlas = "0.3.34"
repame-fx = "0.3.34"
repame-input = "0.3.34"
repame-audio = "0.3.34"
repame-rapier2d = "0.3.34"
repose-core = "0.31"
repose-ui = "0.31"
repose-material = "0.31"
repose-render-wgpu = "0.31"
game-utils = "0.4"
log = "0.4"
web-time = "1"
# PNG decode for atlas uploads (repame ships no image dep; the game decodes
# its own pixels per repame-atlas docs). Pinned to the cached 0.25 line.
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[target.'cfg(target_os = "android")'.dependencies]
winit = "0.30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { version = "0.3", features = [
    "wasm_js",
], package = "getrandom" }
getrandom_02 = { version = "0.2", features = ["js"], package = "getrandom" }

[package.metadata.android.sdk]
min_sdk_version = 26
version_code = 82

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
codegen-units = 1
lto = "thin"

[profile.web-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
