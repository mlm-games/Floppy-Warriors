[package]
name = "floppy-warriors"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "Floppy Warriors - janky ragdoll archery roguelite"
repository = "https://github.com/mlm-games/floppy-warriors"
readme = "README.md"
keywords = ["bevy", "gamedev", "ragdoll", "2d", "repose"]
categories = ["game-development"]
rust-version = "1.96"
default-run = "floppy-warriors"

[lib]
name = "floppy_warriors"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "floppy-warriors"
path = "src/main.rs"

[features]
default = ["dev_native"]
dev = []
dev_native = ["dev"]
# Big-game optional crates (check note below)
# Keep commented until compatible to avoid breakage.
# input_manager = ["dep:leafwing-input-manager"]
# hanabi = ["dep:bevy_hanabi"]
# pkv = ["dep:bevy_pkv"]
# asset_loader = ["dep:bevy_asset_loader"]
# inspector = ["dep:bevy-inspector-egui"]
# kira_audio = ["dep:bevy_kira_audio"]

[dependencies]
bevy_ecs = "0.19"
glam = "0.33"
repame-sim = { path = "../../Repos/repame/crates/repame-sim", version = "0.2" }
repame-shell = { path = "../../Repos/repame/crates/repame-shell", version = "0.2" }
repame-anim = { path = "../../Repos/repame/crates/repame-anim", version = "0.2" }
repame-sprite = { path = "../../Repos/repame/crates/repame-sprite", version = "0.2" }
repame-atlas = { path = "../../Repos/repame/crates/repame-atlas", version = "0.2" }
repame-fx = { path = "../../Repos/repame/crates/repame-fx", version = "0.2" }
repame-input = { path = "../../Repos/repame/crates/repame-input", version = "0.2" }
repame-audio = { path = "../../Repos/repame/crates/repame-audio", version = "0.2" }
repame-rapier2d = { path = "../../Repos/repame/crates/repame-rapier2d", version = "0.2" }
repose-core = { path = "../../Repos/repose/crates/repose-core", version = "0.30" }
repose-ui = { path = "../../Repos/repose/crates/repose-ui", version = "0.30" }
repose-canvas = { path = "../../Repos/repose/crates/repose-canvas", version = "0.30" }
repose-render-wgpu = { path = "../../Repos/repose/crates/repose-render-wgpu", version = "0.30" }
repose-text = { path = "../../Repos/repose/crates/repose-text", version = "0.30" }
wgpu = "30"
repose-material = { path = "../../Repos/repose/crates/repose-material", version = "0.30" }
repose-app = { path = "../../Repos/repose/crates/repose-app", version = "0.30" }
repose-platform = { path = "../../Repos/repose/crates/repose-platform", version = "0.30" }
game-utils = { path = "../../Repos/game-utils/crates/game-utils" }
log = "0.4"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
winit = "0.30"
anyhow = "1"
renamite-io-svg = { path = "../../Repos/renamite/crates/renamite-io-svg" }
renamite-io-ren = { path = "../../Repos/renamite/crates/renamite-io-ren" }
renamite-player = { path = "../../Repos/renamite/crates/renamite-player" }
renamite-render-bridge = { path = "../../Repos/renamite/crates/renamite-render-bridge" }
renamite-render-offscreen = { path = "../../Repos/renamite/crates/renamite-render-offscreen" }
renamite-behavior-common = { path = "../../Repos/renamite/crates/renamite-behavior-common" }
renamite-model = { path = "../../Repos/renamite/crates/renamite-model" }
# Optional big-game crates (pull in bevy-0.19)
# leafwing-input-manager = { version = "0.14", optional = true, default-features = false, features = [] }
# bevy_hanabi = { version = "0.14", optional = true, default-features = false, features = ["2d"] }
# bevy_pkv = { version = "0.13", optional = true }
# bevy_asset_loader = { version = "0.22", optional = true, default-features = false, features = ["standard"] }
# bevy-inspector-egui = { version = "0.28", optional = true }
# bevy_kira_audio = { version = "0.18", optional = true }

[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { version = "0.3", features = [
    "wasm_js",
], package = "getrandom" }
getrandom_02 = { version = "0.2", features = ["js"], package = "getrandom" }

[package.metadata.android.sdk]
min_sdk_version = 26
version_code = 82

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
codegen-units = 1
lto = "thin"

[profile.web-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[patch.crates-io]
repose-core = { path = "../../Repos/repose/crates/repose-core" }
repose-ui = { path = "../../Repos/repose/crates/repose-ui" }
repose-canvas = { path = "../../Repos/repose/crates/repose-canvas" }
repose-render-wgpu = { path = "../../Repos/repose/crates/repose-render-wgpu" }
repose-text = { path = "../../Repos/repose/crates/repose-text" }
repose-app = { path = "../../Repos/repose/crates/repose-app" }
repose-platform = { path = "../../Repos/repose/crates/repose-platform" }
repose-tree = { path = "../../Repos/repose/crates/repose-tree" }
repose-devtools = { path = "../../Repos/repose/crates/repose-devtools" }
repose-navigation = { path = "../../Repos/repose/crates/repose-navigation" }
repose-material = { path = "../../Repos/repose/crates/repose-material" }
repose-docking = { path = "../../Repos/repose/crates/repose-docking" }
repose-macros = { path = "../../Repos/repose/crates/repose-macros" }
