id: com.mlm-games.floppy-warriors
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: floppy-warriors
modules:
  - name: floppy-warriors
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/floppy-warriors /app/bin/floppy-warriors
    sources:
      - type: dir
        path: .
